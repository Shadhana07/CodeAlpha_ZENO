<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZENO - My Orders</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="logo">
            <span class="bag"></span>
            <span class="purple-z">Z</span><span class="white-eno">ENO</span>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#products">Shop</a>
            <a href="my-orders.html" class="active">My Orders</a>
        </nav>
    </header>

    <!-- MY ORDERS -->
    <section class="register-section">

        <div class="register-box">

            <h1>My Orders</h1>

            <div id="orders-list">
                <p>Loading your orders...</p>
            </div>

            <p>
                <a href="index.html">← Back to Shopping</a>
            </p>

        </div>

    </section>

    <script>

        async function loadOrders() {

            const ordersList = document.getElementById("orders-list");

            try {

                const response = await fetch("/my-orders");

                const orders = await response.json();

                if (!response.ok) {
                    ordersList.innerHTML = "<p>Please log in to view your orders.</p>";
                    return;
                }

                if (orders.length === 0) {
                    ordersList.innerHTML = "<p>You haven't placed any orders yet.</p>";
                    return;
                }

                ordersList.innerHTML = "";

                orders.forEach(function(order) {

                    const orderBox = document.createElement("div");

                    orderBox.style.background = "#f3effa";
                    orderBox.style.padding = "15px";
                    orderBox.style.marginBottom = "15px";
                    orderBox.style.borderRadius = "10px";
                    orderBox.style.textAlign = "left";

                    const heading = document.createElement("h3");
                    heading.textContent = "Order #" + order.id;

                    const items = document.createElement("p");

                    const products = JSON.parse(order.items);

                    items.textContent = products.map(function(item) {
                        return item.name + " - ₹" + item.price;
                    }).join(", ");

                    const total = document.createElement("p");
                    total.textContent = "Total: ₹" + order.total;

                    const date = document.createElement("p");
                    date.textContent = "Date: " + order.order_date;

                    orderBox.appendChild(heading);
                    orderBox.appendChild(items);
                    orderBox.appendChild(total);
                    orderBox.appendChild(date);

                    ordersList.appendChild(orderBox);

                });

            } catch (error) {

                ordersList.innerHTML = "<p>Unable to load orders. Please try again.</p>";

            }

        }

        loadOrders();

    </script>

</body>
</html>
